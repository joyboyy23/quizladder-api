openapi: 3.0.3
info:
  title: QuizLadder API
  version: 1.6.1
  description: >
    Multiplayer educational Snake and Ladder game for the SorSU Bulan Campus library.
    Implements Hub Contract v1.3. Every error answers
    { "error": { "code", "message" } }.


    Log in with POST /auth/login, then click Authorize and paste the token.
  contact:
    name: Joenilo Estillero (joyboyy23)
servers:
  - url: /api/v1
    description: This API server
tags:
  - name: Hub Contract
    description: Endpoints provided to the Library Game Hub
  - name: Accounts
    description: Registration, login, and the current account
  - name: Users
    description: Administrator-only account management
  - name: Question Sets
    description: Question-set management; HOST or ADMIN is required
  - name: Questions
    description: Nested question-bank management; HOST or ADMIN is required
  - name: Sessions
    description: Lobbies and seated player management
  - name: Gameplay
    description: Public and player-only live game actions
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The token from POST /auth/login
    hubKey:
      type: apiKey
      in: header
      name: X-Hub-Key
      description: The key the Library Game Hub sends
  parameters:
    SessionCode:
      name: code
      in: path
      required: true
      schema:
        type: string
        pattern: ^[1-9][0-9]{5}$
    QuestionSetId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    QuestionId:
      name: questionId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
  responses:
    BadRequest:
      description: The request is malformed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: VALIDATION_FAILED
              message: name must be 3 to 100 characters long
              details:
                - field: name
                  message: name must be 3 to 100 characters long
    Unauthorized:
      description: No login or the token is not valid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: AUTH_REQUIRED
              message: Log in first
    Forbidden:
      description: Logged in, but not allowed to perform the action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: FORBIDDEN
              message: This question set belongs to another host.
    NotFound:
      description: The requested resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The request conflicts with the current state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: VALIDATION_FAILED
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
    User:
      type: object
      required: [user_id, school_id, full_name, email, role, created_at]
      properties:
        user_id:
          type: integer
        school_id:
          type: string
          example: FAC-0042
        full_name:
          type: string
          example: Maria Ong
        email:
          type: string
          format: email
          example: maria@sorsu.edu.ph
        role:
          type: string
          enum: [PLAYER, HOST, ADMIN]
        created_at:
          type: string
          format: date-time
    UserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
    LoginResponse:
      type: object
      required: [token, token_type, expires_in, user]
      properties:
        token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: string
          example: 1h
        user:
          $ref: "#/components/schemas/User"
    Meta:
      type: object
      required: [page, limit, total, pages]
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 23
        pages:
          type: integer
          example: 3
    Choice:
      type: object
      required: [choice_index, text, is_correct]
      properties:
        choice_index:
          type: integer
          minimum: 1
          maximum: 4
        text:
          type: string
        is_correct:
          type: boolean
    Question:
      type: object
      required: [id, position, text, choices]
      properties:
        id:
          type: integer
        position:
          type: integer
        text:
          type: string
        choices:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: "#/components/schemas/Choice"
    QuestionSet:
      type: object
      required: [id, name, owner_id, cover_url, created_at]
      properties:
        id:
          type: integer
        name:
          type: string
        owner_id:
          type: integer
          nullable: true
        cover_url:
          type: string
          nullable: true
          example: /uploads/covers/set-1-<uuid>.png
        created_at:
          type: string
          format: date-time
        questions:
          type: array
          items:
            $ref: "#/components/schemas/Question"
    QuestionSetEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/QuestionSet"
        meta:
          $ref: "#/components/schemas/Meta"
    QuestionEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Question"
        meta:
          $ref: "#/components/schemas/Meta"
    Session:
      type: object
      required: [code, status, question_set_id, host_id, started_at, finished_at]
      properties:
        code:
          type: string
          pattern: ^[1-9][0-9]{5}$
        status:
          type: string
          enum: [WAITING, PLAYING, FINISHED]
        question_set_id:
          type: integer
        host_id:
          type: integer
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
    Player:
      type: object
      required: [player_id, nickname, avatar_color, position]
      properties:
        player_id:
          type: integer
        nickname:
          type: string
        avatar_color:
          type: string
          enum: [RED, BLUE, GREEN, YELLOW]
        position:
          type: integer
    JoinResponse:
      type: object
      required: [player_id, nickname, avatar_color, position, rejoined, session]
      properties:
        player_id:
          type: integer
        nickname:
          type: string
        avatar_color:
          type: string
          enum: [RED, BLUE, GREEN, YELLOW]
        position:
          type: integer
        rejoined:
          type: boolean
        session:
          type: object
          required: [code, status]
          properties:
            code:
              type: string
            status:
              type: string
              enum: [WAITING, PLAYING, FINISHED]
    PlayersList:
      type: object
      required: [session, players]
      properties:
        session:
          $ref: "#/components/schemas/Session"
        players:
          type: array
          items:
            $ref: "#/components/schemas/Player"
    GameState:
      type: object
      required: [status, current_player, turn_phase, seconds_left, server_time, players]
      properties:
        status:
          type: string
          enum: [WAITING, PLAYING, FINISHED]
        current_player:
          type: object
          nullable: true
          properties:
            player_id:
              type: integer
            nickname:
              type: string
        turn_phase:
          type: string
          nullable: true
          enum: [ROLL, QUESTION, PUNISH]
        seconds_left:
          type: integer
        server_time:
          type: string
          format: date-time
        players:
          type: array
          items:
            type: object
            required: [player_id, nickname, avatar_color, position, finish_position]
            properties:
              player_id:
                type: integer
              nickname:
                type: string
              avatar_color:
                type: string
                enum: [RED, BLUE, GREEN, YELLOW]
              position:
                type: integer
              finish_position:
                type: integer
                nullable: true
    RollResult:
      type: object
      required: [dice, from, to, tile_type, snake_or_ladder_to, finished, next_phase]
      properties:
        dice:
          type: integer
          minimum: 1
          maximum: 6
        from:
          type: integer
        to:
          type: integer
        tile_type:
          type: string
          enum: [NORMAL, EVENT, SNAKE, LADDER]
        snake_or_ladder_to:
          type: integer
          nullable: true
        finished:
          type: boolean
        next_phase:
          type: string
          nullable: true
          enum: [ROLL, QUESTION, PUNISH]
    PendingQuestion:
      type: object
      required: [question_id, question, choices, seconds_left]
      properties:
        question_id:
          type: integer
        question:
          type: string
        choices:
          type: array
          items:
            type: object
            required: [choice_index, text]
            properties:
              choice_index:
                type: integer
                minimum: 1
                maximum: 4
              text:
                type: string
        seconds_left:
          type: integer
    AnswerResult:
      type: object
      required: [correct, from, to, finished, next_phase]
      properties:
        correct:
          type: boolean
        from:
          type: integer
        to:
          type: integer
        finished:
          type: boolean
        next_phase:
          type: string
          nullable: true
          enum: [ROLL, QUESTION, PUNISH]
    PunishResult:
      type: object
      required: [target_player_id, from, to, finished, next_phase]
      properties:
        target_player_id:
          type: integer
        from:
          type: integer
        to:
          type: integer
        finished:
          type: boolean
        next_phase:
          type: string
          nullable: true
          enum: [ROLL, QUESTION, PUNISH]
    Leaderboard:
      type: object
      required: [players]
      properties:
        players:
          type: array
          items:
            type: object
            required: [rank, player_id, nickname, position, finish_position]
            properties:
              rank:
                type: integer
                nullable: true
              player_id:
                type: integer
              nickname:
                type: string
              position:
                type: integer
              finish_position:
                type: integer
                nullable: true
    ResultsResponse:
      type: object
      required: [game, developer, generated_at, results]
      properties:
        game:
          type: string
          example: quizladder
        developer:
          type: string
          example: joyboyy23
        generated_at:
          type: string
          format: date-time
        results:
          type: array
          items:
            type: object
            required: [session_code, started_at, ended_at, players, podium]
            properties:
              session_code:
                type: string
              started_at:
                type: string
                format: date-time
                nullable: true
              ended_at:
                type: string
                format: date-time
              players:
                type: array
                items:
                  type: object
                  required: [school_id, nickname, score, completed, finish_position, rank]
                  properties:
                    school_id:
                      type: string
                    nickname:
                      type: string
                    score:
                      type: integer
                    completed:
                      type: boolean
                    finish_position:
                      type: integer
                      nullable: true
                    rank:
                      type: integer
                      nullable: true
              podium:
                type: array
                items:
                  type: object
                  required: [rank, school_id, nickname, score]
                  properties:
                    rank:
                      type: integer
                    school_id:
                      type: string
                    nickname:
                      type: string
                    score:
                      type: integer
paths:
  /health:
    get:
      tags: [Hub Contract]
      summary: Check API and database health
      security: []
      responses:
        "200":
          description: The API and database are reachable
          content:
            application/json:
              schema:
                type: object
              example:
                status: ok
                service: quizladder-api
                version: 1.6.1
                database: up
                uptime_seconds: 42
                timestamp: 2026-11-21T02:00:00.000Z
        "503":
          description: The database cannot be reached
  /game-info:
    get:
      tags: [Hub Contract]
      summary: Get Hub game card information
      security: []
      responses:
        "200":
          description: The QuizLadder game card
          content:
            application/json:
              schema:
                type: object
              example:
                slug: quizladder
                name: QuizLadder
                team: Team 8 (3-1)
                developer: joyboyy23
                description: Multiplayer educational Snake and Ladder game for the SorSU Bulan Campus library.
                min_players: 2
                max_players: 4
                version: 1.6.1
  /results:
    get:
      tags: [Hub Contract]
      summary: Get finished games for the Library Game Hub
      description: Requires the X-Hub-Key header. The optional since value filters by game end date-time.
      security:
        - hubKey: []
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Finished games in the Hub Contract format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultsResponse"
        "400":
          description: The since parameter is not a date and time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: INVALID_SINCE
                  message: since must be a date and time, for example 2026-10-20T00:00:00Z.
        "401":
          description: The hub key is missing or wrong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: HUB_KEY_REQUIRED
                  message: X-Hub-Key is required.
  /auth/register:
    post:
      tags: [Accounts]
      summary: Register a PLAYER account
      description: A role in the body is ignored; admins promote accounts through PATCH /users/{id}/role.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [school_id, full_name, email, password]
              properties:
                school_id:
                  type: string
                  pattern: ^[A-Z0-9]{3,6}-[0-9]{3,5}$
                  example: 2023-00123
                full_name:
                  type: string
                  minLength: 2
                  maxLength: 100
                  example: Maria Ong
                email:
                  type: string
                  format: email
                  example: maria@sorsu.edu.ph
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
                  example: Libro-2026
            example:
              school_id: 2023-00123
              full_name: Maria Ong
              email: maria@sorsu.edu.ph
              password: Libro-2026
      responses:
        "201":
          description: Registered account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /auth/login:
    post:
      tags: [Accounts]
      summary: Log in and receive a bearer token
      description: Unknown account and wrong-password failures use the same non-specific answer.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [school_id, password]
              properties:
                school_id:
                  type: string
                  example: 2023-00123
                password:
                  type: string
                  example: Libro-2026
            example:
              school_id: 2023-00123
              password: Libro-2026
      responses:
        "200":
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: School ID or password is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: Invalid school ID or password.
  /auth/me:
    get:
      tags: [Accounts]
      summary: Get the current account
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users:
    get:
      tags: [Users]
      summary: List all accounts
      description: ADMIN only; other roles receive 403 FORBIDDEN.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Plain array of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /users/{id}/role:
    patch:
      tags: [Users]
      summary: Change an account role
      description: ADMIN only; an account cannot change its own role.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [PLAYER, HOST, ADMIN]
            example:
              role: HOST
      responses:
        "200":
          description: The bare updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The user does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: USER_NOT_FOUND
                  message: User not found.
        "409":
          description: The account cannot change its own role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: CANNOT_CHANGE_OWN_ROLE
                  message: You cannot change your own role.
  /question-sets:
    get:
      tags: [Question Sets]
      summary: Search and page question sets
      description: HOST or ADMIN only. Search is case-insensitive; percent and underscore in q are literal characters.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: sort
          in: query
          schema:
            type: string
            enum: [id, name, created_at]
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: q
          in: query
          description: Literal case-insensitive search text; 1-100 characters
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        "200":
          description: Paged question-set data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionSetEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Question Sets]
      summary: Create a question set
      description: The owner is the caller. Extra body fields are ignored.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 100
                  example: Biology Basics
            example:
              name: Biology Basics
      responses:
        "201":
          description: Created question set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionSet"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The set name is already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: NAME_TAKEN
                  message: A question set with this name already exists.
  /question-sets/{id}:
    get:
      tags: [Question Sets]
      summary: Get a question set
      description: include=questions is the only supported include value.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestionSetId"
        - name: include
          in: query
          required: false
          schema:
            type: string
            enum: [questions]
      responses:
        "200":
          description: Question set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionSet"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The question set does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: QUESTION_SET_NOT_FOUND
                  message: Question set not found.
    patch:
      tags: [Question Sets]
      summary: Rename a question set
      description: The owner or an ADMIN may rename a set; renaming a set used by a game is allowed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestionSetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 100
                  example: Biology Review
            example:
              name: Biology Review
      responses:
        "200":
          description: Renamed question set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionSet"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The set belongs to another host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: FORBIDDEN
                  message: This question set belongs to another host.
        "404":
          description: The question set does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: QUESTION_SET_NOT_FOUND
                  message: Question set not found.
        "409":
          description: The renamed set name is already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: NAME_TAKEN
                  message: A question set with this name already exists.
    delete:
      tags: [Question Sets]
      summary: Delete an unused question set
      description: The owner or an ADMIN may delete a set; used sets cannot be deleted and their questions and choices are removed only with the set.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestionSetId"
      responses:
        "204":
          description: Question set deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The question set does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: QUESTION_SET_NOT_FOUND
                  message: Question set not found.
        "409":
