          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: SESSION_NOT_FOUND
                  message: Session not found.
        "409":
          description: The game or turn phase is not ready for a question
          content:
            application/json:
              schema:
