                  code: QUESTION_SET_IN_USE
                  message: This question set is used by a game.
  /sessions:
    post:
      tags: [Sessions]
      summary: Create a game lobby
      description: HOST or ADMIN only. The server picks the six-digit join code; a client-sent join_code is ignored.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question_set_id]
              properties:
                question_set_id:
                  type: integer
                  minimum: 1
                  example: 1
            example:
              question_set_id: 1
      responses:
        "201":
          description: Waiting session lobby
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The account is not HOST or ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: FORBIDDEN
                  message: HOST or ADMIN role required.
        "404":
          description: The question set does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: QUESTION_SET_NOT_FOUND
                  message: Question set not found.
  /sessions/{code}:
    parameters:
      - $ref: "#/components/parameters/SessionCode"
    get:
      tags: [Sessions]
      summary: Get a lobby or game session
      description: Public; no account is required.
      security: []
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: The session does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: SESSION_NOT_FOUND
                  message: Session not found.
    patch:
      tags: [Sessions]
      summary: Change a session status
      description: HOST or ADMIN only. WAITING to PLAYING needs 2 to 4 seated players; WAITING or PLAYING can move to FINISHED.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [PLAYING, FINISHED]
            example:
              status: PLAYING
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The session does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: SESSION_NOT_FOUND
                  message: Session not found.
        "409":
          description: The player count or status transition is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                players:
                  value:
                    error:
                      code: NOT_ENOUGH_PLAYERS
                      message: A game needs 2 to 4 seated players to start.
                transition:
                  value:
                    error:
                      code: INVALID_STATUS_TRANSITION
                      message: This status transition is not allowed.
  /sessions/{code}/players:
    parameters:
      - $ref: "#/components/parameters/SessionCode"
    get:
      tags: [Sessions]
      summary: List seated players
      description: Public and ordered by board position.
      security: []
      responses:
        "200":
          description: Session and seated players
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayersList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: The session does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: SESSION_NOT_FOUND
                  message: Session not found.
    post:
      tags: [Sessions]
      summary: Join or rejoin a session
      description: One account may be seated in only one PLAYING game at a time. A returning account always gets its seat back, including after the game finishes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname, avatar_color]
              properties:
                nickname:
                  type: string
                  minLength: 2
                  maxLength: 24
                  example: Bea
                avatar_color:
                  type: string
                  enum: [RED, BLUE, GREEN, YELLOW]
                  example: BLUE
            example:
              nickname: Bea
              avatar_color: BLUE
      responses:
        "201":
          description: New seat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinResponse"
        "200":
          description: Returning seat rejoined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The session does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: SESSION_NOT_FOUND
                  message: Session not found.
        "409":
          description: The join conflicts with the session or account state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                seated:
                  value:
                    error:
                      code: ALREADY_IN_GAME
                      message: This account is seated in another PLAYING game.
                ended:
                  value:
                    error:
                      code: SESSION_ENDED
                      message: This session has ended.
                waiting:
                  value:
                    error:
                      code: SESSION_NOT_JOINABLE
                      message: This session is not accepting players.
                full:
                  value:
                    error:
                      code: SESSION_FULL
                      message: This session already has four players.
                nickname:
                  value:
                    error:
                      code: NICKNAME_TAKEN
                      message: This nickname is already taken.
                avatar:
                  value:
                    error:
                      code: AVATAR_COLOR_TAKEN
                      message: This avatar color is already taken.
  /sessions/{code}/state:
    get:
      tags: [Gameplay]
      summary: Get live game state
      description: Public. The server lazily applies one expired timeout for roll 10 seconds, question 15 seconds, or punish 10 seconds.
      security: []
      parameters:
        - $ref: "#/components/parameters/SessionCode"
      responses:
        "200":
          description: Current game state without a session_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: The session does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: SESSION_NOT_FOUND
                  message: Session not found.
  /sessions/{code}/roll:
    post:
      tags: [Gameplay]
      summary: Roll and resolve the current turn
      description: The seated current player only. dice and event are test-only overrides outside production.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionCode"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dice:
                  type: integer
                  minimum: 1
                  maximum: 6
                  description: Test-only override; ignored in production
                event:
                  type: string
                  enum: [QUESTION, PUNISHMENT]
                  description: Test-only override; ignored in production
            example:
              dice: 3
              event: QUESTION
      responses:
        "200":
          description: Roll and movement result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The account is not seated in this game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: NOT_SEATED
                  message: You are not seated in this game.
        "404":
          description: The session does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: SESSION_NOT_FOUND
                  message: Session not found.
        "409":
          description: The game or turn phase is not ready for a roll
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                playing:
                  value:
                    error:
                      code: GAME_NOT_PLAYING
                      message: The game is not playing.
                turn:
                  value:
                    error:
                      code: NOT_YOUR_TURN
                      message: It is not your turn.
                phase:
                  value:
                    error:
                      code: WRONG_PHASE
                      message: The game is not in the roll phase.
