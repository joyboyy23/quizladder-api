                  message: Session not found.
  /question-sets/{id}/cover:
    put:
      tags: [Question Sets]
      summary: Upload or replace a question-set cover
      description: OWNER or ADMIN only. PNG or JPEG, maximum 1 MB. The server renames the file. Covers may change even when the set is used.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestionSetId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [cover]
              properties:
                cover:
                  type: string
                  format: binary
      responses:
        "200":
          description: Updated question set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionSet"
        "400":
          description: Cover missing, invalid, or upload malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                required:
                  value:
                    error:
                      code: COVER_REQUIRED
                      message: cover is required
                invalid:
                  value:
                    error:
                      code: INVALID_FILE_TYPE
                      message: cover must be PNG or JPEG
                upload:
                  value:
                    error:
                      code: INVALID_UPLOAD
                      message: The cover upload is invalid.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The question set does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: QUESTION_SET_NOT_FOUND
                  message: Question set not found.
        "413":
          description: The uploaded file is larger than 1 MB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: FILE_TOO_LARGE
                  message: Cover file must be 1 MB or smaller.
  /question-sets/{id}/questions:
    get:
      tags: [Questions]
      summary: List questions in a set
      description: HOST or ADMIN only. Questions are ordered by position.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestionSetId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paged question data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The question set does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: QUESTION_SET_NOT_FOUND
                  message: Question set not found.
    post:
      tags: [Questions]
      summary: Add a question to a set
      description: OWNER or ADMIN only. A set may contain at most 100 questions and cannot be changed after use.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestionSetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, choices]
              properties:
                text:
                  type: string
                  minLength: 5
                  maxLength: 300
                choices:
                  type: array
                  minItems: 4
                  maxItems: 4
                  items:
                    type: object
                    required: [text, is_correct]
                    properties:
                      text:
                        type: string
                        minLength: 1
                        maxLength: 120
                      is_correct:
                        type: boolean
            example:
              text: What is the largest planet?
              choices:
                - text: Earth
                  is_correct: false
                - text: Jupiter
                  is_correct: true
                - text: Mars
                  is_correct: false
                - text: Venus
                  is_correct: false
      responses:
        "201":
          description: Created question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The question set does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: QUESTION_SET_NOT_FOUND
                  message: Question set not found.
        "409":
          description: The set is used, full, or has a position conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                inUse:
                  value:
                    error:
                      code: QUESTION_SET_IN_USE
                      message: This question set is used by a game.
                limit:
                  value:
                    error:
                      code: QUESTION_LIMIT_REACHED
                      message: A question set cannot contain more than 100 questions.
                position:
                  value:
                    error:
                      code: POSITION_CONFLICT
                      message: The requested question position conflicts with another question.
