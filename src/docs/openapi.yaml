        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The question set or question does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                set:
                  value:
                    error:
                      code: QUESTION_SET_NOT_FOUND
                      message: Question set not found.
                question:
                  value:
                    error:
                      code: QUESTION_NOT_FOUND
                      message: Question not found.
        "409":
          description: Used sets cannot have questions deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: QUESTION_SET_IN_USE
                  message: This question set is used by a game.
